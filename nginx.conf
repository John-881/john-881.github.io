# 静态站点服务配置（Valaxy SSG 产物）
#
# 【放在哪】本文件是 server 片段，必须落到 /etc/nginx/conf.d/*.conf：官方镜像自带的
# /etc/nginx/nginx.conf 已经在 http{} 里 include 了这个目录。整份替换主配置会直接启动失败
# （nginx: [emerg] "server" directive is not allowed here），Dockerfile 早期就是这么 COPY 的。
#
# 【为什么要归一 .html】dist 里每篇文章是 x.html，但客户端路由表只登记干净路径 /posts/<slug>。
# 浏览器拿到 /posts/<slug>.html 时静态文件能命中、HTML 也对，水合完成后 Vue Router 匹配不到，
# 页面会渲染成「页面不存在」。所以把 .html 一律 301 到干净路径，与 vercel.json 的 cleanUrls 等价。
#
# 映射用 $request_uri 而不是 $uri：$request_uri 在 error_page 的内部重定向里保持不变，
# 因此 /404.html（由 error_page 内部转发而来）不会被卷进「.html ↔ 干净名」的重定向环。
# map 的匹配顺序是：先精确串，再按书写顺序试正则。

map $request_uri $clean_html {
    default                   '';
    /404.html                 '';            # 404 页自身保留，不参与归一
    /index.html               /;             # 根索引页收敛到 /
    ~^(?<dir>.+)/index\.html$ ${dir}/;       # /foo/index.html -> /foo/
    ~^(?<page>.+)\.html$      $page;         # /posts/x.html   -> /posts/x
}

server {
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    listen 80;
    server_name _;
    index index.html;

    location / {
        # content location
        root /usr/share/nginx/html;

        # 先做 .html -> 干净路径的 301，再走文件查找
        if ($clean_html) {
            return 301 $clean_html;
        }

        # exact matches -> reverse clean urls -> folders -> not found
        try_files $uri $uri.html $uri/ =404;

        # non existent pages
        error_page 404 /404.html;

        # a folder without index.html raises 403 in this setup
        error_page 403 /404.html;

        # adjust caching headers
        # files in the assets folder have hashed filenames
        location ~* ^/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
